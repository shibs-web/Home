<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة — شِبس</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a18">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
    .nf{ min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 2rem 1.25rem; }
    .nf-box{ max-width: 520px; }
    .nf-logo{ width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 1.5rem; box-shadow: 0 0 0 1px var(--line-strong), 0 0 60px -10px rgba(245,187,46,.35); }
    .nf-code{ font-family: var(--font-code); color: var(--gold); font-size: .95rem; letter-spacing: .1em; }
    .nf h1{ font-size: clamp(1.7rem, 6vw, 2.4rem); margin: .4rem 0 .8rem; }
    .nf p{ color: var(--ink-soft); margin-bottom: 1.8rem; }
    .nf .hero-actions{ justify-content: center; }
</style>
</head>
<body>
<main class="nf">
    <div class="nf-box">
        <img class="nf-logo" src="/img/icon-192.png" alt="شِبس" width="120" height="120">
        <p class="nf-code" dir="ltr">404 · NOT FOUND</p>
        <h1>هذه الصفحة غير موجودة</h1>
        <p>ربما تغيّر الرابط أو حُذفت الصفحة. يمكنك العودة إلى الرئيسية أو التواصل معنا مباشرة.</p>
        <div class="hero-actions">
            <a href="/" class="btn btn-primary">الصفحة الرئيسية</a>
            <a href="/#contact" class="btn btn-outline">تواصل معنا</a>
        </div>
    </div>
</main>
</body>
</html>
